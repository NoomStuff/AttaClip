name: Linux capture

on:
   push:
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

jobs:
   actual-capture:
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - name: Install matching OBS headers and runtime
           run: |
              sudo add-apt-repository -y ppa:obsproject/obs-studio
              sudo apt-get update
              sudo apt-get install -y obs-studio=32.2.0-0obsproject1~noble cmake g++ make pkg-config libx11-dev libxcb-composite0-dev libpulse-dev libsimde-dev xvfb openbox x11-apps x11-xserver-utils ffmpeg pulseaudio pulseaudio-utils
         - name: Build native X11 recorder
           run: bun scripts/build-native-linux.ts
         - name: Build isolated application audio fixtures
           run: |
              cmake -S native/tests -B .cache/native-tests-linux -DCMAKE_BUILD_TYPE=Release
              cmake --build .cache/native-tests-linux -j2
         - name: Verify selected application audio isolation and recovery
           run: python3 scripts/smoke-linux-app-audio.py resources/recorder
         - name: Record actual screen and audio
           run: python3 scripts/smoke-linux.py resources/recorder
           env:
              ATTACLIP_TEST_X11_APP: "1"
         - run: bun install --frozen-lockfile
         - name: Stage pinned standalone media for the private package test
           run: bun scripts/provision-media.ts
         - run: bun run bundle:media
         - run: bun run build:icons
         - run: bun run build:notices
         - run: bun run build
         - name: Build the AppImage without publishing
           run: bunx electron-builder --linux AppImage --publish never
         - name: Verify actual AppImage capture, playback and sharing
           run: bun run test:packaged:linux release/*.AppImage
         - name: Keep synthetic capture evidence
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: linux-capture-evidence
              path: |
                 .cache/linux-smoke/**/measurements.json
                 .cache/linux-smoke/**/events.json
                 .cache/linux-smoke/**/*.log
                 .cache/linux-packaged/**/report.json
                 .cache/linux-packaged/**/*.log
              if-no-files-found: ignore
